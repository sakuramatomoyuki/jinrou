name: Mobile effects regression
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm install --prefix tests/browser --ignore-scripts --no-audit --no-fund
      - run: npx --prefix tests/browser playwright install --with-deps chromium webkit
      - run: npm test --prefix tests/browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-effects-results
          path: |
            tests/browser/playwright-report
            tests/browser/test-results
          if-no-files-found: ignore
