name: Unit and Firebase integration tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm test
      - name: Run isolated Auth, Functions and Database integration tests
        run: npm run test:integration
      - name: Keep emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logs
          path: |
            *debug.log
            *debug.*.log
          if-no-files-found: ignore
          retention-days: 7
